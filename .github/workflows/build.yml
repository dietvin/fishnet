name: Build and Release
permissions:
  contents: write
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build on ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact_name: fishnet-linux-x86_64
            executable: fishnet
          - target: aarch64-unknown-linux-gnu
            artifact_name: fishnet-linux-aarch64
            executable: fishnet
          - target: x86_64-pc-windows-gnu
            artifact_name: fishnet-windows
            executable: fishnet.exe
   
    steps:
      - uses: actions/checkout@v4
     
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
     
      - name: Install cross
        run: cargo install cross
     
      - name: Build with cross
        run: cross build --release --target ${{ matrix.target }}
     
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.executable }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Rename artifacts for release
        run: |
          version=${{ github.ref_name }}
          mv fishnet-linux-x86_64/fishnet fishnet-linux-x86_64-$version
          mv fishnet-linux-aarch64/fishnet fishnet-linux-aarch64-$version
          mv fishnet-windows/fishnet.exe fishnet-windows-$version.exe

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            fishnet-linux-x86_64-${{ github.ref_name }}
            fishnet-linux-aarch64-${{ github.ref_name }}
            fishnet-windows-${{ github.ref_name }}.exe
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}