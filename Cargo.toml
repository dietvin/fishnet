[workspace]
members = [
    "fishnet",
    "alignment",
    "pod5_reader_api", 
    "reformat", 
    "helper",
    "kmer_table"
]
resolver = "2"

[workspace.package]
version = "0.4.2"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/dietvin/fishnet"

[workspace.dependencies]
# Shared dependencies
approx = "0.5.1"
arrow2 = { version = "0.18.0", features = ["io_parquet", "io_parquet_compression", "compute_concatenate", "io_ipc"] }
bincode = "1"
bitvec = "1.0.1"
bstr = "1.12.1"
chrono = "0.4.41"
clap = { version = "4.5.47", features = ["cargo"] }
console = "0.16.0"
crossbeam = "0.8.4"
delta-encoding = "0.4.8"
flatbuffers = "25.2.10"
indicatif = "0.18.0"
itertools = "0.14.0"
log = "0.4.28"
log4rs = "1.3.0"
noodles = { version = "0.99.0", features = ["bam", "bgzf", "sam"] }
rand = "0.9.0"
serde = "1.0.219"
serde_json = "1.0.141"
tempfile = "3.22.0"
thiserror = "2.0.12"
uuid = "1.17.0"
walkdir = "2.5.0"
zigzag = "0.1.0"
zstd = "0.13.3"
